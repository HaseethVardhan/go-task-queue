
services:
  postgres:
    image: postgres:17
    container_name: gotask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gotask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gotask_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gotask}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    profiles: ["tools"]

volumes:
  postgres_data:
